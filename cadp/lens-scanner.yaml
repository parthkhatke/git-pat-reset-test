name: wf-git-token-update-test-sc
version: v1
type: workflow
workspace: public
layer: user
tags:
  - Tier.Gold
  - SemanticModelAgent
description: Scanner workflow for consumer-aligned data product
  git-token-update-test (metadata registration in DataOS).
workflow:
  dag:
    - name: git-token-update-test-scan
      description: Scanner for git-token-update-test (data product metadata registration).
      spec:
        stack: scanner:2.0
        compute: runnable-default
        stackSpec:
          type: data-product
          sourceConfig:
            config:
              type: DataProductMetadata
              markDeletedDataProducts: true
              dataProductFilterPattern:
                includes:
                  - git-token-update-test
